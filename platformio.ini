; Plane Radar: ESP32-C3 Super Mini and classic ESP32-WROOM-32

[platformio]
default_envs = supermini

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

build_flags =
  -std=gnu++17
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; ESP32-C3 Super Mini (native USB serial)
[env:supermini]
board = esp32-c3-devkitm-1
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Classic ESP32-WROOM-32 DevKit (USB-to-UART serial, 4 MB flash, no PSRAM)
[env:esp32dev]
board = esp32dev
board_upload.flash_size = 4MB
